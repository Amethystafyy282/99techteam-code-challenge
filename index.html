<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>99Tech Code Challenge</title>
    <script>
      // Apply the saved theme before the first paint, defaulting to dark, so the page never flashes the wrong theme.
      // The 'theme' key must match THEME_STORAGE_KEY in src/shared/constants/theme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (error) {}
        document.documentElement.classList.toggle('dark', theme !== 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
